<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Seeing Roundnet">
<meta name="theme-color" content="#111111">
<title>Seeing Roundnet – PoC</title>
<style>
  :root { --bg:#111; --panel:#1c1c1c; --fg:#f2f2f2; --muted:#9a9a9a; --btn:#2b2b2b; --accent:#ff3b30; --ok:#30d158; --warn:#ffd60a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font-family:-apple-system, system-ui, Segoe UI, Roboto, sans-serif; -webkit-user-select:none; user-select:none; }
  #app { position:fixed; inset:0; display:grid; grid-template-columns:1fr; grid-template-rows:auto 1fr auto;
         grid-template-areas:"head" "stage" "bar";
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { grid-area:head; display:flex; align-items:center; justify-content:space-between; gap:6px; padding:4px 10px; }
  header h1 { font-size:14px; margin:0; white-space:nowrap; }
  header .sub { font-size:10px; color:var(--muted); white-space:nowrap; }
  header .hbtns { display:flex; gap:6px; align-items:center; flex:0 0 auto; }
  @media (max-width:420px) { header .sub { display:none; } }
  header button, header select { min-height:30px; padding:4px 8px; font-size:12px; border-radius:8px; }
  #stageWrap { grid-area:stage; position:relative; min-height:0; min-width:0; display:flex; align-items:center; justify-content:center; background:#000; overflow:hidden; }
  #stage { position:relative; background:#000; }
  #stage video, #stage canvas { position:absolute; inset:0; width:100%; height:100%; }
  #stage video { object-fit:fill; }
  #view { touch-action:none; }
  #placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:15px; text-align:center; padding:16px; cursor:pointer; z-index:1; }
  #zoomReset { position:absolute; top:8px; right:8px; z-index:2; display:none; min-height:34px; padding:4px 10px; font-size:13px; background:rgba(0,0,0,.65); }
  #recBadge { position:absolute; top:8px; left:8px; background:var(--accent); color:#fff; font-size:13px; font-weight:700; padding:3px 8px; border-radius:6px; display:none; pointer-events:none; font-variant-numeric:tabular-nums; z-index:2; }
  #recBadge.paused { background:var(--warn); color:#111; }
  #stall { position:absolute; left:8px; right:8px; top:40px; display:none; background:rgba(58,29,0,.95); color:var(--warn); border-radius:10px; padding:8px 10px; font-size:14px; z-index:3; }
  #bar { grid-area:bar; padding:6px 8px 8px; background:#151515; border-top:1px solid #262626; }
  .row { display:flex; gap:8px; align-items:center; }
  #scrub { flex:1; min-width:80px; accent-color:var(--accent); height:28px; }
  #time { font-variant-numeric:tabular-nums; font-size:12px; color:var(--muted); white-space:nowrap; }
  .tools { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-top:6px; }
  .break { flex-basis:100%; height:0; }
  .sep { width:1px; align-self:stretch; background:#333; margin:0 2px; flex:0 0 1px; }
  button, .filebtn, select { background:var(--btn); color:var(--fg); border:0; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  .tools button, .tools .filebtn { flex:0 0 auto; min-width:42px; height:42px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center; }
  button:disabled { opacity:.35; }
  button.active { background:#fff; color:#111; }
  .filebtn input { display:none; }
  .filebtn.disabled { opacity:.35; pointer-events:none; }
  #color i { display:inline-block; width:20px; height:20px; border-radius:50%; border:2px solid rgba(255,255,255,.6); }
  #rec { background:var(--accent); color:#fff; min-width:64px; }
  #rec.recording { background:#fff; color:var(--accent); }
  #sheet { position:fixed; left:0; right:0; bottom:0; max-height:72dvh; overflow-y:auto; background:var(--panel); border-radius:16px 16px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.6); padding:10px 14px calc(14px + env(safe-area-inset-bottom)); display:none; z-index:10; -webkit-user-select:text; user-select:text; }
  #sheet .close { position:sticky; top:0; float:right; min-height:34px; padding:4px 12px; font-size:14px; z-index:1; }
  .card { margin:6px 0 10px; display:none; }
  .card p { margin:0 0 8px; font-size:14px; }
  .card button { min-height:44px; padding:10px 13px; margin:0 6px 6px 0; }
  #result video { width:100%; max-height:42dvh; border-radius:8px; background:#000; margin-bottom:8px; }
  progress { width:100%; height:8px; margin-bottom:8px; accent-color:var(--ok); }
  .warn { color:var(--warn); }
  #info { font-size:11px; color:var(--muted); margin:6px 0; clear:both; }
  #debug { max-height:40dvh; overflow:auto; background:#000; color:#7CFC9A; font:11px/1.35 ui-monospace, Menlo, monospace; padding:6px 8px; white-space:pre-wrap; display:none; border:1px solid #333; border-radius:8px; }
  #debug .e { color:#ff6b6b; } #debug .w { color:#ffd60a; }
  @media (orientation:landscape) and (max-height:600px) {
    #app { grid-template-columns:1fr 196px; grid-template-rows:auto 1fr; grid-template-areas:"stage head" "stage bar"; }
    header { flex-direction:column; align-items:stretch; padding:6px 8px 0; }
    #bar { border-top:0; border-left:1px solid #262626; overflow-y:auto; }
    .row { flex-wrap:wrap; }
    .sep, .break { display:none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Seeing Roundnet</h1>
      <div class="sub" id="ver">Proof of concept v2.4</div>
    </div>
    <div class="hbtns">
      <select id="quality" aria-label="Recording quality"><option value="1280">720p</option><option value="1920">1080p</option></select>
      <button id="logBtn">Log</button>
      <button id="diag">Report</button>
    </div>
  </header>

  <div id="stageWrap">
    <div id="stage">
      <video id="video" playsinline muted preload="auto"></video>
      <canvas id="view"></canvas>
      <div id="placeholder">Tap here to load a video</div>
      <button id="zoomReset" aria-label="Reset zoom">Zoom 1×</button>
      <div id="recBadge">● REC 00:00</div>
      <div id="stall"></div>
    </div>
  </div>

  <div id="bar">
    <div class="row">
      <input id="scrub" type="range" min="0" max="0" step="0.001" value="0" disabled>
      <span id="time">00:00.000 / 00:00.000</span>
    </div>
    <div class="tools">
      <label class="filebtn" id="loadBtn" aria-label="Load video">📂<input id="file" type="file" accept="video/*"></label>
      <button id="back" disabled aria-label="Previous frame">◀︎</button>
      <button id="play" disabled aria-label="Play">▶</button>
      <button id="fwd" disabled aria-label="Next frame">▶︎|</button>
      <button id="speed" disabled aria-label="Speed">1×</button>
      <span class="sep"></span>
      <button id="rec" disabled aria-label="Start recording">● REC</button>
      <button id="recPause" disabled aria-label="Pause recording">❚❚</button>
      <span class="break"></span>
      <button class="tool active" data-t="pen" disabled aria-label="Pen">✎</button>
      <button class="tool" data-t="arrow" disabled aria-label="Arrow">↗</button>
      <button id="color" disabled aria-label="Colour"><i style="background:#ff3b30"></i></button>
      <button id="undo" disabled aria-label="Undo">↶</button>
      <button id="clear" disabled aria-label="Clear drawings">✕</button>
      <span class="sep"></span>
      <button id="exportBtn" disabled aria-label="Saved video">⬆︎ Video</button>
    </div>
  </div>
</div>

<div id="sheet">
  <button class="close" id="sheetClose">Close</button>
  <div id="banner" class="card">
    <p id="bannerText"></p>
    <button id="recover">Recover it</button>
    <button id="dismiss">Discard</button>
  </div>
  <div id="result" class="card">
    <p id="resultText"></p>
    <progress id="progress" max="1" value="0"></progress>
    <video id="preview" playsinline controls></video>
    <button id="save">Share video</button>
    <button id="saveFile">Save to Files</button>
    <p class="hint" style="font-size:12px;color:var(--muted);margin:4px 0 8px">Very long videos: use “Save to Files”, then in the Files app open the video and choose Share → Save Video to put it in Photos.</p>
    <button id="saveRaw" style="display:none">Share raw file</button>
    <button id="discard">Delete recording</button>
  </div>
  <div id="info"></div>
  <div id="debug"></div>
</div>

<script>
(() => {
  'use strict';
  const VERSION = 'PoC v2.4';
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const DEBUG = !params.has('nodebug');            // log shown by default during the PoC
  const COMPAT = !params.has('nocompat');           // behave like iOS 17 (no audio WebCodecs) — on by default
  const RENDER_FPS = Math.min(60, Math.max(15, +params.get('fps') || 30));
  let maxSide = +params.get('max') || (() => { try { return +localStorage.getItem('sr-quality-v22'); } catch (e) { return 0; } })() || 1280;   // 720p by default: lighter on iPhone memory
  maxSide = Math.min(3840, Math.max(640, maxSide));
  const videoBps = () => Math.max(0.5, +params.get('mbps') || (maxSide <= 1280 ? 3 : 6)) * 1e6;
  const MB = 1048576;

  $('ver').textContent = `Proof of concept v2.4${COMPAT ? ' · iOS 17 compat' : ''}${DEBUG ? ' · debug' : ''}`;

  // ---------------------------------------------------------------- logging
  const logLines = [];
  const t0 = performance.now();
  function log(msg, level = 'i') {
    const line = `[${((performance.now() - t0) / 1000).toFixed(1).padStart(7)}s] ${level === 'e' ? 'ERROR ' : level === 'w' ? 'WARN ' : ''}${msg}`;
    logLines.push(line);
    if (logLines.length > 2000) logLines.splice(0, logLines.length - 2000);
    (level === 'e' ? console.error : level === 'w' ? console.warn : console.log)(line);
    schedulePersistLog(level !== 'i');
    if (DEBUG) {
      const d = document.createElement('div');
      if (level !== 'i') d.className = level;
      d.textContent = line;
      $('debug').appendChild(d);
      while ($('debug').childNodes.length > 400) $('debug').removeChild($('debug').firstChild);
      $('debug').scrollTop = $('debug').scrollHeight;
    }
  }
  if (DEBUG) $('debug').style.display = 'block';
  const openSheet = () => { $('sheet').style.display = 'block'; };
  const closeSheet = () => { $('sheet').style.display = 'none'; };
  $('logBtn').onclick = () => $('sheet').style.display === 'block' ? closeSheet() : openSheet();
  $('sheetClose').onclick = closeSheet;
  let persistTimer = null, prevLog = [];
  function schedulePersistLog(now) {
    if (persistTimer && !now) return;
    clearTimeout(persistTimer);
    persistTimer = setTimeout(() => {
      persistTimer = null;
      if (typeof setMeta === 'function') setMeta('log', { lines: logLines.slice(-1500), at: new Date().toISOString() }).catch(() => {});
    }, now ? 50 : 2000);
  }
  window.addEventListener('error', e => log(`Uncaught: ${e.message} @${e.filename}:${e.lineno}`, 'e'));
  window.addEventListener('unhandledrejection', e => log(`Unhandled promise: ${e.reason && (e.reason.stack || e.reason.message) || e.reason}`, 'e'));
  const mbs = b => (b / MB).toFixed(1) + ' MB';
  const errMsg = e => (e && (e.message || e.name)) || String(e);

  if (COMPAT) {
    // iOS 17 Safari has no audio WebCodecs: hide them so newer phones behave like Scott's.
    for (const k of ['AudioEncoder', 'AudioDecoder', 'AudioData']) {
      try { Object.defineProperty(window, k, { value: undefined, configurable: true, writable: true }); } catch (e) { log('compat: could not hide ' + k, 'w'); }
    }
    log('Compat mode: audio WebCodecs hidden');
  }

  // ---------------------------------------------------------------- storage (IndexedDB)
  const DB_NAME = 'seeing-roundnet-v2';
  let dbPromise = null;
  function openDB() {
    if (!dbPromise) dbPromise = new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('chunks', { keyPath: 'i' });   // raw recording, 1 record per second
        d.createObjectStore('out', { keyPath: 'i' });      // converted MP4, 4 MB parts
        d.createObjectStore('meta', { keyPath: 'k' });     // session state, action log
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbPromise;
  }
  async function tx(store, mode, fn) {
    const d = await openDB();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error || new Error('IndexedDB error'));
      t.onabort = () => rej(t.error || new Error('IndexedDB transaction aborted'));
    });
  }
  const putRec = (s, v) => tx(s, 'readwrite', o => o.put(v));
  const getAll = s => tx(s, 'readonly', o => o.getAll());
  const clearStore = s => tx(s, 'readwrite', o => o.clear());
  const getMeta = k => tx('meta', 'readonly', o => o.get(k));
  const setMeta = (k, v) => putRec('meta', Object.assign({ k }, v));
  const delMeta = k => tx('meta', 'readwrite', o => o.delete(k));

  let blobMode = 'blob';  // store Blobs (disk-backed); fall back to ArrayBuffers if refused
  async function putBlobRecord(store, rec) {
    if (blobMode === 'blob') {
      try { await putRec(store, rec); return; }
      catch (e) { log(`IndexedDB refused a Blob (${errMsg(e)}), switching to ArrayBuffer mode`, 'w'); blobMode = 'buffer'; }
    }
    const copy = Object.assign({}, rec, { blob: await rec.blob.arrayBuffer() });
    await putRec(store, copy);
  }
  const asBlob = (b, type) => b instanceof Blob ? b : new Blob([b], type ? { type } : undefined);

  async function storageInfo() {
    try {
      const e = await navigator.storage.estimate();
      return { usage: e.usage || 0, quota: e.quota || 0, text: `${mbs(e.usage || 0)} used / ${mbs(e.quota || 0)} available to the app` };
    } catch (e) { return { usage: 0, quota: 0, text: 'storage estimate unavailable' }; }
  }

  // ---------------------------------------------------------------- canvas + state
  const video = $('video'), view = $('view'), ctx = view.getContext('2d');
  const ink = document.createElement('canvas'), ictx = ink.getContext('2d');
  const frame = document.createElement('canvas'), fctx = frame.getContext('2d');   // last good video frame
  let frameValid = false, lastFrameTime = -1, blankFrames = 0;
  let strokes = [], current = null, tool = 'pen', color = '#ff3b30';
  let fps = 30, fpsSamples = [];
  let recorder = null, micStream = null, wakeLock = null;
  let recState = 'idle';          // idle | recording | paused | finishing
  let recStart = 0, recPausedAt = 0, recPausedTotal = 0, recTimer = null, metaTimer = null;
  let chunkCount = 0, recBytes = 0, writeChain = Promise.resolve(), writeErrors = 0, stopRequested = false;
  let actions = [];
  let resultFile = null, resultUrl = null, rawBlob = null;
  let flushTimer = null, lastDataAt = 0, maxGap = 0, stallWarned = false, emptyChunks = 0, videoPlayingAtRecPause = false;
  let sessionId = null;

  const recElapsed = () => recState === 'idle' ? 0 :
    ((recState === 'paused' ? recPausedAt : performance.now()) - recStart - recPausedTotal);

  function act(type, extra) {
    if (recState === 'idle' || recState === 'finishing') return;
    actions.push(Object.assign({ t: Math.round(recElapsed()), type, vt: +video.currentTime.toFixed(3), rate: video.playbackRate }, extra || {}));
  }

  // ---------------------------------------------------------------- helpers
  const fmtT = s => {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60), r = s - m * 60;
    return `${String(m).padStart(2, '0')}:${r.toFixed(3).padStart(6, '0')}`;
  };
  const fmtRec = ms => {
    const s = Math.floor(ms / 1000);
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  };
  function pickType() {
    if (!window.MediaRecorder) return '';
    const candidates = [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4;codecs=avc1,mp4a',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    return candidates.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } }) || '';
  }
  function setInfo(extra) {
    const size = view.width ? `${view.width}×${view.height}` : '–';
    $('info').textContent = `${VERSION} · format: ${pickType() || 'browser default'} · output: ${size} @${RENDER_FPS}fps · source ≈${fps}fps${extra ? ' · ' + extra : ''}`;
  }
  const editControls = () => [...document.querySelectorAll('#bar button, #scrub')];
  function enableEditing(on) {
    editControls().forEach(el => { if (el.id !== 'recPause') el.disabled = !on; });
    $('recPause').disabled = !(recState === 'recording' || recState === 'paused');
  }

  // ---------------------------------------------------------------- load video
  $('file').addEventListener('change', e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (recState !== 'idle') { alert('Stop the recording before loading another video.'); return; }
    if (video.src) URL.revokeObjectURL(video.src);
    log(`Loading ${f.name || 'video'} · ${mbs(f.size)} · ${f.type || 'unknown type'}`);
    fpsSamples = []; fps = 30; fpsMeasured = false; fileLoadId++; frameValid = false; resetZoom();
    video.src = URL.createObjectURL(f);
    video.load();
  });
  ['emptied', 'stalled', 'waiting', 'abort'].forEach(ev => video.addEventListener(ev, () => {
    if (video.src) log(`Video event: ${ev} (readyState ${video.readyState}, t=${fmtT(video.currentTime)})`, ev === 'waiting' ? 'i' : 'w');
  }));
  $('placeholder').onclick = () => { if (recState === 'idle') $('file').click(); };
  video.addEventListener('error', () => log(`Video element error: ${video.error && video.error.message || video.error && video.error.code}`, 'e'));

  function applySize() {
    const w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return null;
    const s = Math.min(1, maxSide / Math.max(w, h));
    const ow = Math.round(w * s / 2) * 2, oh = Math.round(h * s / 2) * 2;   // even sizes for H.264
    if (view.width === ow && view.height === oh && frame.width === ow) { fitStage(); return { w, h, ow, oh }; }
    const oldInk = ink.width ? { w: ink.width, h: ink.height } : null;
    view.width = ink.width = frame.width = ow;
    view.height = ink.height = frame.height = oh;
    if (oldInk && (oldInk.w !== ow)) {            // keep drawings in place when the quality changes
      const k = ow / oldInk.w;
      strokes.forEach(st => { st.w = Math.max(3, st.w * k); st.pts = st.pts.map(p => [p[0] * k, p[1] * k]); });
    }
    redrawInk(); frameValid = false; resetZoom();
    fitStage();
    return { w, h, ow, oh };
  }
  // The video area takes all the room left by the toolbar, keeping the video's proportions.
  function fitStage() {
    const wrap = $('stageWrap'), st = $('stage');
    const W = wrap.clientWidth, H = wrap.clientHeight;
    const ar = view.width && view.height ? view.width / view.height : 16 / 9;
    let w = W, h = W / ar;
    if (h > H) { h = H; w = H * ar; }
    st.style.width = Math.floor(w) + 'px'; st.style.height = Math.floor(h) + 'px';
  }
  if (window.ResizeObserver) new ResizeObserver(fitStage).observe($('stageWrap'));
  window.addEventListener('resize', fitStage);
  fitStage();
  $('quality').value = String(maxSide <= 1280 ? 1280 : 1920);
  $('quality').onchange = () => {
    if (recState !== 'idle') { $('quality').value = String(maxSide); return; }
    maxSide = +$('quality').value;
    try { localStorage.setItem('sr-quality-v22', String(maxSide)); } catch (e) {}
    const r = applySize();
    log(`Quality set to ${maxSide <= 1280 ? '720p' : '1080p'}${r ? ` → output ${r.ow}×${r.oh}` : ''}`);
    setInfo();
  };

  let fileLoadId = 0, setUpFor = -1, lastGoodTime = 0, wasPlaying = false, reloads = 0;
  video.addEventListener('loadedmetadata', () => {
    if (!video.videoWidth || !video.videoHeight) { log('Video has no picture size', 'e'); return; }
    if (setUpFor === fileLoadId) {
      // Same file, reloaded by Safari (it unloads big videos under memory pressure).
      // Keep everything as it was: position, drawings, output size, recording.
      reloads++;
      log(`Safari reloaded the video (#${reloads}) → back to ${fmtT(lastGoodTime)}${wasPlaying ? ', resuming playback' : ''}`, 'w');
      video.currentTime = lastGoodTime;
      if (wasPlaying) video.play().catch(e => log('Could not resume playback: ' + errMsg(e), 'w'));
      return;
    }
    setUpFor = fileLoadId; reloads = 0; lastGoodTime = 0; wasPlaying = false;
    strokes = [];
    const { w, h, ow, oh } = applySize();
    $('placeholder').style.display = 'none';
    $('scrub').max = video.duration;
    strokes = []; redrawInk();
    video.currentTime = 0.001;   // makes iOS decode the first frame
    enableEditing(true);
    log(`Video ready: ${w}×${h} (${w >= h ? 'landscape' : 'portrait'}), ${video.duration.toFixed(1)} s → output ${ow}×${oh}`);
    setInfo();
  });

  // estimate the source frame rate (for frame-by-frame steps)
  // Frames can be skipped on screen but never invented, so the real frame interval is the
  // smallest one we see reliably. We take the median of 30 consecutive clean samples and
  // only ever move the estimate up (except for the very first measurement of a file).
  let fpsMeasured = false;
  function trackFrames() {
    if (!('requestVideoFrameCallback' in HTMLVideoElement.prototype)) return;
    let last = null, lastFrames = 0;
    const reset = () => { last = null; fpsSamples = []; };
    ['seeking', 'ratechange', 'pause', 'play', 'emptied'].forEach(ev => video.addEventListener(ev, reset));
    const cb = (now, meta) => {
      if (last !== null && !video.paused && meta.presentedFrames - lastFrames === 1) {
        const d = meta.mediaTime - last;
        if (d > 0.003 && d < 0.2) {
          fpsSamples.push(d);
          if (fpsSamples.length >= 30) {
            const sorted = fpsSamples.slice().sort((a, b) => a - b);
            const est = 1 / sorted[Math.floor(sorted.length / 2)];
            const snapped = [24, 25, 30, 48, 50, 60, 120, 240].reduce((a, b) => Math.abs(b - est) < Math.abs(a - est) ? b : a, 30);
            if (!fpsMeasured || snapped > fps) {

  class SpillWriter {
    constructor() { this.cap = 4 * MB; this.buf = new Uint8Array(this.cap); this.bufStart = 0; this.bufLen = 0; this.end = 0; this.patches = []; this.idx = 0; }
    async write(data, pos) {
      const n = data.length;
      if (pos > this.end) await this.append(new Uint8Array(pos - this.end));
      const ovEnd = Math.min(pos + n, this.end);
      if (pos < ovEnd) {                                  // overwrite of bytes already written
        const flushedEnd = Math.min(ovEnd, this.bufStart);
        if (pos < flushedEnd) this.patches.push({ pos, bytes: data.slice(0, flushedEnd - pos) });
        const from = Math.max(pos, this.bufStart);
        if (from < ovEnd) this.buf.set(data.subarray(from - pos, ovEnd - pos), from - this.bufStart);
      }
      if (pos + n > this.end) await this.append(data.subarray(this.end - pos));
    }
    async append(d) {
      let off = 0;
      while (off < d.length) {
        const k = Math.min(this.cap - this.bufLen, d.length - off);
        this.buf.set(d.subarray(off, off + k), this.bufLen);
        this.bufLen += k; off += k; this.end += k;
        if (this.bufLen === this.cap) await this.flush();
      }
    }
    async flush() {
      if (!this.bufLen) return;
      const blob = new Blob([this.buf.slice(0, this.bufLen)]);
      await putBlobRecord('out', { i: this.idx++, start: this.bufStart, size: this.bufLen, blob });
      this.bufStart += this.bufLen; this.bufLen = 0;
    }
  }

      const t = performance.now();
      try { mediabunny = await import('./mediabunny.min.mjs'); }       // bundled copy: works offline
      catch (e) { log('Local conversion library unavailable (' + errMsg(e) + '), using CDN', 'w'); mediabunny = await import('https://cdn.jsdelivr.net/npm/mediabunny@1/+esm'); }
      log(`Conversion library loaded in ${((performance.now() - t) / 1000).toFixed(1)} s`);
    }
    return mediabunny;
  }

  async function toStandardMp4(raw, onProgress) {
    const { Input, Output, Conversion, ALL_FORMATS, BlobSource, StreamTarget, Mp4OutputFormat } = await loadMediabunny();
    await clearStore('out');
    const writer = new SpillWriter();
    const writable = new WritableStream({ write: chunk => writer.write(chunk.data, chunk.position) });
    const input = new Input({ source: new BlobSource(raw), formats: ALL_FORMATS });
    const output = new Output({
      format: new Mp4OutputFormat({ fastStart: false }),
      target: new StreamTarget(writable, { chunked: true, chunkSize: 4 * MB })
    });
    const conversion = await Conversion.init({ input, output });
    if (conversion.discardedTracks && conversion.discardedTracks.length) {
      log('Tracks dropped by conversion: ' + conversion.discardedTracks.map(d => `${d.track.type} (${d.reason})`).join(', '), 'w');
    }
    if (!conversion.isValid) throw new Error('This recording cannot be converted on this device');
    conversion.onProgress = onProgress;
    await conversion.execute();
    await writer.flush();
    log(`Converted file: ${mbs(writer.end)} in ${writer.idx} parts, ${writer.patches.length} header patch(es)`);
    await setMeta('export', { patches: writer.patches, size: writer.end });
    return assembleOutput(writer.patches, 'video/mp4');
  }

  async function finalizeFromStorage(durationMs) {
    showResult('Preparing video…');
    $('progress').style.display = ''; $('progress').value = 0;
    $('save').disabled = true; $('saveFile').disabled = true; $('saveRaw').style.display = 'none';
    const session = await getMeta('session').catch(() => null);
    const mime = (session && session.mime) || 'video/mp4';
    let records;
    try { records = (await getAll('chunks')).sort((a, b) => a.i - b.i); }
    catch (e) { log('Could not read the saved recording: ' + errMsg(e), 'e'); showResult('⚠︎ Could not read the saved recording: ' + errMsg(e)); return; }
    if (!records.length) { showResult('⚠︎ Nothing was recorded.'); return; }
    const missing = records.length && records[records.length - 1].i + 1 - records.length;
    if (missing) log(`${missing} chunk(s) missing in storage`, 'w');
    rawBlob = new Blob(records.map(r => asBlob(r.blob)), { type: mime.split(';')[0] });
    log(`Raw recording: ${mbs(rawBlob.size)} from ${records.length} chunks (${blobMode} mode)`);

    const t = performance.now();
    try {
      const mp4 = await toStandardMp4(rawBlob, p => {
        $('progress').value = p;
        $('resultText').textContent = `Preparing video… ${Math.round(p * 100)}%`;
      });
      const secs = (performance.now() - t) / 1000;
      if (mp4.size < 20000) throw new Error('the saved data contains no usable video yet');
      log(`Export ready in ${secs.toFixed(1)} s`);
      await setMeta('session', Object.assign({}, session || {}, { state: 'exported', exportSeconds: +secs.toFixed(1) }));
      await clearStore('chunks').catch(() => {});    // free space: the converted file is kept
      rawBlob = null;
      setResultFile(mp4, durationMs, `standard MP4 · ready in ${secs.toFixed(1)} s`);
    } catch (e) {
      log('Conversion failed: ' + (e && e.stack || errMsg(e)), 'e');
      setResultFile(rawBlob, durationMs, '⚠︎ not converted: ' + errMsg(e), true);
    }
  }

  // ---------------------------------------------------------------- result / sharing
  function fileName(type) {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    return `seeing-roundnet-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.${ext}`;
  }
  function showResult(text) {
    $('resultText').textContent = text;
    $('result').style.display = 'block';
    openSheet();
  }
  function hideResult() {
    $('result').style.display = 'none';
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = null; resultFile = null;
    $('preview').removeAttribute('src'); $('preview').load();
  }
  function setResultFile(blob, durationMs, note, isRaw) {
    $('exportBtn').disabled = false;
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = URL.createObjectURL(blob);
    const type = (blob.type || 'video/mp4').split(';')[0];
    resultFile = new File([blob], fileName(type), { type });
    $('preview').src = resultUrl;
    $('progress').style.display = 'none';
    $('resultText').textContent = `Recording ready · ${durationMs ? fmtRec(durationMs) + ' · ' : ''}${mbs(blob.size)} · ${note}`;
    $('resultText').className = isRaw ? 'warn' : '';
    $('save').disabled = false; $('saveFile').disabled = false;
    $('saveRaw').style.display = (DEBUG && rawBlob && !isRaw) ? '' : 'none';
    $('result').style.display = 'block';
    openSheet();
    setInfo(`last file ${mbs(blob.size)}`);
  }
  function download(file, url) {
    const a = document.createElement('a');
    a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  async function shareFile(file, url) {
    log(`Share requested: ${file.name} · ${mbs(file.size)}`);
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      const t = performance.now();
      try { await navigator.share({ files: [file] }); log('Shared ' + file.name); return true; }
      catch (e) {
        log(`Share ended: ${e.name} · ${errMsg(e)} after ${((performance.now() - t) / 1000).toFixed(1)} s`, e.name === 'AbortError' ? 'w' : 'e');
        if (e.name === 'AbortError') return false;
      }
    } else log('Share menu not available for this file', 'w');
    log('Falling back to download');
    download(file, url);
    return true;
  }
  $('save').onclick = () => resultFile && shareFile(resultFile, resultUrl);
  $('exportBtn').onclick = () => { if (resultFile) { $('result').style.display = 'block'; openSheet(); } };
  $('saveFile').onclick = () => {
    if (!resultFile) return;
    log(`Save to Files requested: ${resultFile.name} · ${mbs(resultFile.size)}`);
    schedulePersistLog(true);
    download(resultFile, resultUrl);
  };
  $('saveRaw').onclick = () => {
    if (!rawBlob) return;
    const type = (rawBlob.type || 'video/mp4').split(';')[0];
    const f = new File([rawBlob], 'raw-' + fileName(type), { type });
    shareFile(f, URL.createObjectURL(rawBlob));
  };
  $('discard').onclick = async () => {
    if (!confirm('Delete this recording from the phone?')) return;
    hideResult();
    rawBlob = null;
    await Promise.all(['chunks', 'out', 'meta'].map(clearStore)).catch(() => {});
    log('Recording deleted');
  };

  // ---------------------------------------------------------------- recovery at startup
  function hideBanner() { $('banner').style.display = 'none'; }
  async function checkRecovery() {
    let session;
    try { session = await getMeta('session'); } catch (e) { log('Storage unavailable: ' + errMsg(e), 'e'); return; }
    if (!session) return;
    if (session.state === 'exported') {
      const exp = await getMeta('export').catch(() => null);
      const parts = await getAll('out').catch(() => []);
      if (!parts.length) return;
      $('bannerText').textContent = `Your last video (${fmtRec(session.durationMs || 0)}) is still saved on this phone.`;
      $('recover').textContent = 'Open it';
      $('banner').style.display = 'block'; openSheet();
      $('recover').onclick = async () => {
        hideBanner();
        const blob = await assembleOutput(exp && exp.patches, 'video/mp4');
        setResultFile(blob, session.durationMs, 'standard MP4 (restored)');
      };
    } else {
      const chunks = await getAll('chunks').catch(() => []);
      if (!chunks.length) return;
      $('bannerText').textContent = `An unsaved recording was found (about ${fmtRec(session.durationMs || 0)}). It can be recovered.`;
      $('recover').textContent = 'Recover it';
      $('banner').style.display = 'block'; openSheet();
      $('recover').onclick = () => { hideBanner(); log('Recovering previous recording'); finalizeFromStorage(); };
      log(`Found an unfinished recording: ${chunks.length} chunks`, 'w');
    }
    $('dismiss').onclick = async () => {
      if (!confirm('Delete the saved recording?')) return;
      hideBanner();
      await Promise.all(['chunks', 'out', 'meta'].map(clearStore)).catch(() => {});
    };
  }

  // ---------------------------------------------------------------- diagnostics
  $('diag').onclick = async () => {
    const st = await storageInfo();
    const session = await getMeta('session').catch(() => null);
    const support = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm'].map(t => {
      let ok = false; try { ok = window.MediaRecorder && MediaRecorder.isTypeSupported(t); } catch (e) {}
      return `  ${t}: ${ok}`;
    }).join('\n');
    const report = [
      `Seeing Roundnet diagnostics · ${VERSION} · ${new Date().toISOString()}`,
      `URL: ${location.href}`,
      `User agent: ${navigator.userAgent}`,
      `Screen: ${screen.width}×${screen.height} @${devicePixelRatio}x · standalone: ${!!(navigator.standalone || matchMedia('(display-mode: standalone)').matches)}`,
      `Compat mode: ${COMPAT} · render fps: ${RENDER_FPS} · max side: ${maxSide} · bitrate: ${videoBps() / 1e6} Mbps`,
      `APIs: MediaRecorder=${!!window.MediaRecorder} captureStream=${!!view.captureStream} wakeLock=${'wakeLock' in navigator} VideoEncoder=${!!window.VideoEncoder} AudioEncoder=${!!window.AudioEncoder} rVFC=${'requestVideoFrameCallback' in HTMLVideoElement.prototype}`,
      `Recorder formats:\n${support}`,
      `Storage: ${st.text} · storage mode: ${blobMode}`,
      `Video: ${video.videoWidth}×${video.videoHeight} · ${isFinite(video.duration) ? video.duration.toFixed(1) + ' s' : 'none'} · ≈${fps} fps`,
      `Last session: ${JSON.stringify(session)}`,
      `Actions recorded: ${actions.length}`,
      '',
      '--- Log (this session) ---',
      ...logLines,
      '',
      '--- Log (previous session, e.g. before a crash) ---',
      ...(prevLog.length ? prevLog : ['(none)']),
      '',
      '--- Log (last recording) ---',
      ...(((await getMeta('reclog').catch(() => null)) || {}).lines || ['(none)']),
      '',
      '--- Action log (JSON) ---',
      JSON.stringify(actions)
    ].join('\n');
    const file = new File([report], `seeing-roundnet-diagnostics-${Date.now()}.txt`, { type: 'text/plain' });
    shareFile(file, URL.createObjectURL(file));
  };

  // ---------------------------------------------------------------- start
  log(`${VERSION} · ${navigator.userAgent}`);
  log(`Recorder format: ${pickType() || 'none'} · wakeLock: ${'wakeLock' in navigator} · VideoEncoder: ${!!window.VideoEncoder} · AudioEncoder: ${!!window.AudioEncoder}`);
  setInfo();
  (async () => {
    try {
      const old = await getMeta('log');
      if (old && old.lines) { prevLog = [`(saved ${old.at})`, ...old.lines]; await setMeta('prevlog', { lines: prevLog }); }
      else { const p2 = await getMeta('prevlog'); if (p2 && p2.lines) prevLog = p2.lines; }
      if (prevLog.length) log(`Previous session log available (${prevLog.length} lines)`);
    } catch (e) {}
    schedulePersistLog(true);
    checkRecovery();
  })();
})();
</script>
</body>
</html>
